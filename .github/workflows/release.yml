name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            asset: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: macos-x86_64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: linux-arm64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt,clippy
          rustup default 1.93.1
          rustup target add "${{ matrix.target }}"
      - name: Install Linux static linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
      - name: Link Windows runtime statically
        if: runner.os == 'Windows'
        run: echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"
      - name: Check and build
        run: |
          cargo fmt --check
          cargo clippy --locked --offline --all-targets --target "${{ matrix.target }}" -- -D warnings
          cargo build --release --locked --offline --target "${{ matrix.target }}"
      - name: Test the actual release executable
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            export TICKET_SCRIPT="$PWD/target/$TARGET/release/ticket.exe"
          else
            export TICKET_SCRIPT="$PWD/target/$TARGET/release/ticket"
          fi
          cargo test --release --locked --offline --target "$TARGET"
      - name: Prepare standalone binary
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node.js 24)
        with:
          name: ticket-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish verified binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node.js 24)
        with:
          pattern: ticket-*
          merge-multiple: true
          path: dist
      - name: Verify complete asset set and generate checksums
        run: bash scripts/package.sh --checksums
      - name: Upload all assets before making release visible
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --draft --title "Tickets $TAG" \
            --notes-file RELEASE_NOTES.md dist/*
          gh release edit "$TAG" --draft=false
